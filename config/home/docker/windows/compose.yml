services:
  windows:
    image: dockurr/windows
    container_name: windows
    privileged: true
    environment:
      VERSION: "11"
      CPU_CORES: "4"
      RAM_SIZE: "8G"
      DISK_SIZE: "60G"
      # USERNAME: "eden"
      # PASSWORD: "Longhorn"
      # LANGUAGE: "English"
      # KEYBOARD: "en-US"
      # REGION: "en-IN"
      # ARGUMENTS: "-cpu host,arch_capabilities=off -drive if=none,id=extdisk,format=raw,file=/dev/sda -device usb-storage,drive=extdisk"
      # ARGUMENTS: "-cpu host,arch_capabilities=off -device qemu-xhci -device usb-host,vendorid=0x054c,productid=0x0ca8"
      # MANUAL: "Y"
      DEBUG: "Y"
    volumes:
      - ./os:/storage
      - /home/eden/Sync/Win11_x64.iso:/boot.iso # 26300_9457
      - ./autounattend.xml:/custom.xml
      # - ./oem:/oem
      - ./LAN:/shared
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/kvm
      - /dev/net/tun
      # - /dev/sda
      # - /dev/bus/usb:/dev/bus/usb
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
      - 2222:22
    networks:
      - lan
    stop_grace_period: 2m
    restart: unless-stopped

networks:
  lan:
    external: true
    name: lan
